<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Minimal Vocab</title>
    
    <script>
        window.onerror = function(msg, url, line) { alert("エラー!\n" + msg + "\n行: " + line); return false; };
    </script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #111827; --bg-color: #f9fafb; --surface: #ffffff;
            --text-main: #1f2937; --text-sub: #6b7280; --border: #e5e7eb;
            --success: #059669; --danger: #dc2626; --nav-height: 65px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; }
        .app-container { max-width: 600px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background-color: var(--bg-color); position: relative; }
        header { background: var(--bg-color); padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        header h1 { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
        .header-actions button { background: none; border: none; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; }
        .view-container { flex: 1; overflow-y: auto; padding: 0 20px calc(var(--nav-height) + 20px); }
        .view { display: none; height: 100%; } .view.active { display: flex; flex-direction: column; }
        
        .upload-area {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 24px; display: block; position: relative; overflow: hidden;
        }
        .upload-area.disabled { opacity: 0.5; pointer-events: none; }
        .upload-area input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; display: block; }
        
        .upload-btn { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 8px; pointer-events: none; }
        .status-box { text-align: center; font-size: 0.85rem; color: var(--primary); margin-bottom: 16px; min-height: 20px; font-weight: 600; word-break: break-all; }
        .word-list { display: flex; flex-direction: column; gap: 8px; }
        .word-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .word-item-left { flex: 1; font-weight: 700; font-size: 1rem; word-wrap: break-word; }
        .word-item-right { flex: 1.5; }
        .word-item-right input { width: 100%; border: none; background: transparent; font-size: 0.95rem; color: var(--text-sub); }
        .word-item-right input:focus { outline: none; color: var(--primary); border-bottom: 1px solid var(--primary); padding-bottom: 2px; }
        .btn-speak, .btn-delete { background: none; border: none; font-size: 1.2rem; padding: 4px; color: var(--text-sub); }
        
        /* カード＆タイピング */
        .flashcard-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; perspective: 1000px; }
        .flashcard { width: 100%; max-width: 360px; height: 320px; position: relative; transform-style: preserve-3d; transition: transform 0.5s; cursor: pointer; }
        .flashcard.flipped { transform: rotateX(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; font-size: 2.2rem; font-weight: 800; }
        .card-back { transform: rotateX(180deg); color: var(--text-sub); font-size: 1.8rem; }
        .speaker-icon { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; color: var(--border); }
        .card-controls { display: flex; justify-content: center; gap: 24px; margin-top: 40px; width: 100%; }
        .card-btn { background: var(--surface); border: 1px solid var(--border); width: 56px; height: 56px; border-radius: 28px; font-size: 1.2rem; color: var(--primary); display: flex; align-items: center; justify-content: center; }
        .card-progress { margin-top: 20px; font-size: 0.85rem; color: var(--text-sub); }

        .typing-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .typing-card { background: var(--surface); border: 1px solid var(--border); width: 100%; border-radius: 16px; padding: 40px 24px; text-align: center; }
        .typing-question { font-size: 1.5rem; font-weight: 700; margin-bottom: 30px; color: var(--text-main); }
        .typing-input { width: 100%; padding: 14px; font-size: 1.2rem; border: 1px solid var(--border); border-radius: 8px; text-align: center; margin-bottom: 20px; background: var(--bg-color); }
        .action-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .typing-feedback { font-size: 1.1rem; font-weight: 700; min-height: 40px; margin-bottom: 16px; }

        /* Nav */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: var(--nav-height); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; border-top: 1px solid var(--border); z-index: 10; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; color: var(--text-sub); font-size: 0.7rem; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.2rem; margin-bottom: 4px; }
        .empty-message { text-align: center; color: var(--text-sub); margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>AI Minimal Vocab</h1>
        <div class="header-actions">
            <button id="clearBtn">All Clear</button>
        </div>
    </header>

    <div class="view-container">
        <!-- 1. 単語一覧 -->
        <div id="viewList" class="view active">
            <label class="upload-area" id="uploadArea">
                <span class="upload-btn">AIスキャンする</span>
                <p style="font-size: 0.75rem; color: var(--text-sub); margin-top: 8px;">タップして画像を選択</p>
                <input type="file" id="imageInput" accept="image/*">
            </label>
            <div id="statusBox" class="status-box">準備完了。画像を選んでください。</div>
            <div id="wordList" class="word-list"></div>
        </div>

        <!-- 2. カードビュー -->
        <div id="viewCard" class="view">
            <div id="cardArea" class="flashcard-wrapper" style="display: none;">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front"><div class="speaker-icon" id="cardSpeakBtn">🔊</div><span id="cardFront"></span></div>
                    <div class="card-face card-back" id="cardBack"></div>
                </div>
                <div class="card-controls"><button class="card-btn" id="btnPrev">←</button><button class="card-btn" id="btnNext">→</button></div>
                <div class="card-progress" id="cardProgress"></div>
            </div>
            <div id="cardEmpty" class="empty-message">データがありません</div>
        </div>

        <!-- 3. タイピングビュー -->
        <div id="viewTyping" class="view">
            <div id="typingArea" class="typing-container" style="display: none;">
                <div class="typing-card">
                    <div id="typingProgress" style="color: var(--text-sub); font-size: 0.8rem; margin-bottom: 12px;"></div>
                    <div class="typing-question" id="typingQuestion"></div>
                    <div class="typing-feedback" id="typingFeedback"></div>
                    <input type="text" id="typingInput" class="typing-input" placeholder="Type in English" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                    <button class="action-btn" id="typingActionBtn">回答</button>
                </div>
            </div>
            <div id="typingEmpty" class="empty-message">データがありません</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="viewList"><span class="nav-icon">≡</span><span>List</span></button>
        <button class="nav-item" data-target="viewCard"><span class="nav-icon">▤</span><span>Card</span></button>
        <button class="nav-item" data-target="viewTyping"><span class="nav-icon">⌨</span><span>Type</span></button>
    </nav>
</div>

<script>
    // ==========================================
    // 🤖 Groq API の設定 (Google不要の超高速AI)
    // https://console.groq.com/keys で発行可能です
    // ==========================================
    const GROQ_API_KEY = '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';
    
    // ==========================================
    // ⚠️ Supabaseの設定
    // ==========================================
    let supabaseClient = null;
    let isSupabaseConfigured = false;
    try {
        const SUPABASE_URL = 'https://cdycrnfhuxjjfmwbghua.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkeWNybmZodXhqamZtd2JnaHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjYyNTYsImV4cCI6MjEwNzkwMjI1Nn0.mOZLmGEUqMVfo6IBDqFSxZjDL98eoJp25aE5tfQ161s';
        isSupabaseConfigured = SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('YOUR_SUPABASE_URL');
        if (isSupabaseConfigured && window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch(err) {}

    let words = [];
    const statusBox = document.getElementById('statusBox');
    const wordListEl = document.getElementById('wordList');

    const saveLocal = () => localStorage.setItem('vocab_words', JSON.stringify(words));
    const loadLocal = () => JSON.parse(localStorage.getItem('vocab_words') || '[]');

    const reloadWordsData = async () => {
        words = loadLocal();
        if (supabaseClient) {
            try {
                const { data, error } = await supabaseClient.from('words').select('*');
                if (!error && data) {
                    const map = new Map();
                    words.forEach(w => map.set(w.word, w));
                    data.forEach(w => map.set(w.word, w));
                    words = Array.from(map.values());
                    saveLocal();
                }
            } catch(e) {}
        }
    };

    const renderList = () => {
        wordListEl.innerHTML = '';
        if (words.length === 0) {
            wordListEl.innerHTML = '<div class="empty-message">データがありません。スキャンしてください。</div>';
            return;
        }
        
        const uniqueWords = Array.from(new Map(words.map(item => [item.word, item])).values());
        
        [...uniqueWords].reverse().forEach(item => {
            const el = document.createElement('div'); el.className = 'word-item';
            const left = document.createElement('div'); left.className = 'word-item-left'; left.textContent = item.word;
            const right = document.createElement('div'); right.className = 'word-item-right';
            const input = document.createElement('input'); input.value = item.meaning;
            
            input.addEventListener('change', async (e) => {
                item.meaning = e.target.value.trim();
                saveLocal();
                if (supabaseClient) {
                    await supabaseClient.from('words').upsert([{ word: item.word, meaning: item.meaning }], { onConflict: 'word' }).catch(()=>{});
                }
            });
            
            right.appendChild(input); el.appendChild(left); el.appendChild(right);
            
            const speakBtn = document.createElement('button');
            speakBtn.className = 'btn-speak'; speakBtn.innerHTML = '🔊';
            speakBtn.onclick = () => speakWord(item.word);
            el.appendChild(speakBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete'; delBtn.innerHTML = '✕';
            delBtn.onclick = async () => {
                words = words.filter(w => w.word !== item.word);
                saveLocal();
                renderList();
                if (supabaseClient) {
                    await supabaseClient.from('words').delete().eq('word', item.word).catch(()=>{});
                }
            };
            el.appendChild(delBtn);
            wordListEl.appendChild(el);
        });
    };

    const speakWord = (text) => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    };

    const getBase64Image = (file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    };

    // ==========================================
    // 📸 Groq Vision AI スキャン処理
    // ==========================================
    const imageInput = document.getElementById('imageInput');
    const uploadArea = document.getElementById('uploadArea');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) { return; }
        
        if (GROQ_API_KEY === 'YOUR_GROQ_API_KEY') {
            alert('Groq APIキーを設定してください！');
            return;
        }

        uploadArea.classList.add('disabled');
        statusBox.style.color = 'var(--text-main)';
        statusBox.textContent = 'AIに画像を送信中...';

        try {
            const dataUrl = await getBase64Image(file);

            const prompt = `
                Extract all English words and their Japanese meanings from this image.
                Rules:
                1. Ignore any numbers (like 1., ①, (1)) or bullet points.
                2. Provide concise and accurate Japanese translations.
                3. Respond ONLY with a valid JSON array like this:
                [{"word": "apple", "meaning": "りんご"}, {"word": "book", "meaning": "本"}]
            `;

            const requestBody = {
                model: "llama-3.2-11b-vision-preview",
                messages: [
                    {
                        role: "user",
                        content: [
                            { type: "text", text: prompt },
                            { type: "image_url", image_url: { url: dataUrl } }
                        ]
                    }
                ],
                temperature: 0.1,
                response_format: { type: "json_object" }
            };

            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errJson = await response.json().catch(() => ({}));
                throw new Error(`Groq APIエラー: ${response.status} ${errJson.error?.message || ''}`);
            }

            const resData = await response.json();
            const content = resData.choices[0].message.content;
            
            // JSON部分の抽出
            let parsedWords = [];
            const jsonMatch = content.match(/\[.*\]/s);
            if (jsonMatch) {
                parsedWords = JSON.parse(jsonMatch[0]);
            } else {
                const resJson = JSON.parse(content);
                parsedWords = Array.isArray(resJson) ? resJson : (resJson.words || Object.values(resJson)[0] || []);
            }

            if (parsedWords && parsedWords.length > 0) {
                const formattedWords = parsedWords.map(w => ({ word: String(w.word).toLowerCase(), meaning: String(w.meaning) }));
                
                words = [...words, ...formattedWords];
                saveLocal();
                renderList();
                
                statusBox.style.color = 'var(--success)';
                statusBox.textContent = `${formattedWords.length} 単語を抽出しました！`;

                if (supabaseClient) {
                    try { await supabaseClient.from('words').upsert(formattedWords, { onConflict: 'word' }); } 
                    catch(err) { console.error("クラウド保存エラー", err); }
                }
            } else {
                statusBox.style.color = 'var(--danger)';
                statusBox.textContent = '単語が見つかりませんでした。';
            }

            imageInput.value = '';

        } catch (error) {
            alert("AIエラー:\n" + (error.message || error));
            statusBox.style.color = 'var(--danger)';
            statusBox.textContent = 'AIの解析に失敗しました。';
        } finally {
            uploadArea.classList.remove('disabled');
        }
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
        if(confirm('すべての単語を削除しますか？')) {
            words = [];
            saveLocal();
            renderList();
            if (supabaseClient) {
                await supabaseClient.from('words').delete().neq('word', '').catch(()=>{});
            }
            statusBox.textContent = 'クリアしました。';
        }
    });

    // --- ナビゲーション切り替え ---
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', async () => {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const targetId = btn.getAttribute('data-target');
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');

            await reloadWordsData();
            if (targetId === 'viewList') renderList();
            if (targetId === 'viewCard') initCardMode();
            if (targetId === 'viewTyping') initTypingMode();
        });
    });

    // --- カードモード ---
    let cardIndex = 0; let isCardAnimating = false; 
    const flashcard = document.getElementById('flashcard');
    const cardFront = document.getElementById('cardFront');
    const cardBack = document.getElementById('cardBack');
    const cardProgress = document.getElementById('cardProgress');
    const cardSpeakBtn = document.getElementById('cardSpeakBtn');
    
    const initCardMode = () => {
        if(words.length === 0) { document.getElementById('cardArea').style.display = 'none'; document.getElementById('cardEmpty').style.display = 'block'; return; }
        document.getElementById('cardArea').style.display = 'flex'; document.getElementById('cardEmpty').style.display = 'none';
        cardIndex = 0; isCardAnimating = false; flashcard.classList.remove('flipped'); updateCard();
    };
    const updateCard = () => {
        const item = words[cardIndex]; cardFront.textContent = item.word; cardBack.textContent = item.meaning; cardProgress.textContent = `${cardIndex + 1} / ${words.length}`;
    };
    cardSpeakBtn.addEventListener('click', (e) => { e.stopPropagation(); speakWord(words[cardIndex].word); });
    flashcard.addEventListener('click', () => { if (!isCardAnimating) flashcard.classList.toggle('flipped'); });
    document.getElementById('btnPrev').addEventListener('click', () => {
        if (isCardAnimating) return; isCardAnimating = true; flashcard.classList.remove('flipped');
        setTimeout(() => { cardIndex = (cardIndex - 1 + words.length) % words.length; updateCard(); isCardAnimating = false; }, 150);
    });
    document.getElementById('btnNext').addEventListener('click', () => {
        if (isCardAnimating) return; isCardAnimating = true; flashcard.classList.remove('flipped');
        setTimeout(() => { cardIndex = (cardIndex + 1) % words.length; updateCard(); isCardAnimating = false; }, 150);
    });

    // --- タイピングモード ---
    let typingQueue = []; let typingIndex = 0; let typingState = 'question'; 
    const typingQuestion = document.getElementById('typingQuestion'); const typingInput = document.getElementById('typingInput'); const typingFeedback = document.getElementById('typingFeedback'); const typingActionBtn = document.getElementById('typingActionBtn'); const typingProgress = document.getElementById('typingProgress');
    
    const initTypingMode = () => {
        if(words.length === 0) { document.getElementById('typingArea').style.display = 'none'; document.getElementById('typingEmpty').style.display = 'block'; return; }
        document.getElementById('typingArea').style.display = 'flex'; document.getElementById('typingEmpty').style.display = 'none';
        typingQueue = [...words].sort(() => Math.random() - 0.5); typingIndex = 0; nextTypingQuestion();
    };
    const nextTypingQuestion = () => {
        if (typingIndex >= typingQueue.length) {
            typingQuestion.textContent = '🎉 全問終了！'; typingInput.style.display = 'none'; typingFeedback.innerHTML = ''; typingActionBtn.textContent = 'Restart'; typingActionBtn.style.background = 'var(--primary)'; typingState = 'finished'; typingProgress.textContent = ''; return;
        }
        typingState = 'question'; const item = typingQueue[typingIndex]; typingQuestion.textContent = item.meaning; typingInput.style.display = 'block'; typingInput.value = ''; typingInput.focus(); typingFeedback.innerHTML = ''; typingActionBtn.textContent = 'Check'; typingActionBtn.style.background = 'var(--primary)'; typingProgress.textContent = `残り ${typingQueue.length - typingIndex} 問`;
    };
    const checkTypingAnswer = () => {
        const item = typingQueue[typingIndex]; const userAnswer = typingInput.value.trim().toLowerCase(); const correctAnswer = item.word.toLowerCase();
        typingInput.style.display = 'none';
        if (userAnswer === correctAnswer) {
            typingFeedback.innerHTML = `<span style="color: var(--success);">正解！✨</span>`; typingActionBtn.textContent = 'Next'; typingActionBtn.style.background = 'var(--success)'; speakWord(item.word);
        } else {
            typingFeedback.innerHTML = `<span style="color: var(--danger);">不正解</span><br><span style="font-size: 1.1rem; color: var(--text-main); font-weight: 500;">Ans: <b>${item.word}</b></span>`; typingActionBtn.textContent = 'Next'; typingActionBtn.style.background = 'var(--primary)'; speakWord(item.word);
        }
        typingState = 'answered';
    };
    typingActionBtn.addEventListener('click', () => {
        if (typingState === 'question') checkTypingAnswer();
        else if (typingState === 'answered') { typingIndex++; nextTypingQuestion(); }
        else if (typingState === 'finished') initTypingMode();
    });
    typingInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && typingState === 'question') checkTypingAnswer(); });

    // --- 初期起動 ---
    window.addEventListener('DOMContentLoaded', async () => {
        await reloadWordsData();
        renderList();
    });
</script>
</body>
</html>
