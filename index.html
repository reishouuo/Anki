<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Vocab</title>
    
    <script>
        window.onerror = function(msg, url, line) { alert("エラー:\n" + msg + "\n行: " + line); return false; };
    </script>

    <!-- Tesseract.js (文字認識) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #111827;
            --bg-color: #f9fafb;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --success: #059669;
            --danger: #dc2626;
            --nav-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
        }

        header {
            background: var(--surface);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.01em;
        }

        .header-actions button {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px calc(var(--nav-height) + 20px);
        }

        .view { display: none; height: 100%; }
        .view.active { display: flex; flex-direction: column; }

        .upload-area {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            display: block;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .upload-area.disabled { opacity: 0.5; pointer-events: none; }
        .upload-area input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; display: block;
        }

        .upload-btn {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 6px;
            pointer-events: none;
        }

        .status-box {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 16px;
            min-height: 20px;
            font-weight: 500;
            word-break: break-all;
        }

        .word-list { display: flex; flex-direction: column; gap: 8px; }

        .word-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .word-item-left {
            flex: 1;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--primary);
            word-wrap: break-word;
        }

        .word-item-right { flex: 1.5; }

        .word-item-right input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .word-item-right input:focus {
            outline: none;
            color: var(--primary);
            border-bottom: 1px solid var(--primary);
        }

        .btn-speak, .btn-delete {
            background: none;
            border: none;
            font-size: 0.8rem;
            padding: 4px 6px;
            color: var(--text-sub);
            cursor: pointer;
        }

        .flashcard-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            max-width: 360px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s;
            cursor: pointer;
        }

        .flashcard.flipped { transform: rotateX(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
        }

        .card-back {
            transform: rotateX(180deg);
            color: var(--text-sub);
            font-size: 1.6rem;
        }

        .speaker-btn-card {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 0.75rem;
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 2;
            background: var(--surface);
        }

        .card-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 32px;
            width: 100%;
        }

        .card-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 48px;
            height: 48px;
            border-radius: 24px;
            font-size: 1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .card-progress { margin-top: 16px; font-size: 0.8rem; color: var(--text-sub); }

        .typing-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .typing-card {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
        }

        .typing-question {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .typing-input {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            margin-bottom: 16px;
            background: var(--bg-color);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .typing-feedback {
            font-size: 1rem;
            font-weight: 600;
            min-height: 36px;
            margin-bottom: 12px;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--surface);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active { color: var(--primary); border-top: 2px solid var(--primary); }
        .empty-message { text-align: center; color: var(--text-sub); margin-top: 40px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Smart Vocab</h1>
        <div class="header-actions">
            <button id="clearBtn">すべて削除</button>
        </div>
    </header>

    <div class="view-container">
        <!-- 1. 単語一覧 -->
        <div id="viewList" class="view active">
            <label class="upload-area" id="uploadArea">
                <span class="upload-btn">画像をスキャン</span>
                <p style="font-size: 0.75rem; color: var(--text-sub); margin-top: 6px;">タップしてファイルを選択</p>
                <input type="file" id="imageInput" accept="image/*">
            </label>
            <div id="statusBox" class="status-box">画像を選択してください</div>
            <div id="wordList" class="word-list"></div>
        </div>

        <!-- 2. カードビュー -->
        <div id="viewCard" class="view">
            <div id="cardArea" class="flashcard-wrapper" style="display: none;">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front">
                        <button class="speaker-btn-card" id="cardSpeakBtn">音声</button>
                        <span id="cardFront"></span>
                    </div>
                    <div class="card-face card-back" id="cardBack"></div>
                </div>
                <div class="card-controls">
                    <button class="card-btn" id="btnPrev">&lt;</button>
                    <button class="card-btn" id="btnNext">&gt;</button>
                </div>
                <div class="card-progress" id="cardProgress"></div>
            </div>
            <div id="cardEmpty" class="empty-message">単語が登録されていません</div>
        </div>

        <!-- 3. タイピングビュー -->
        <div id="viewTyping" class="view">
            <div id="typingArea" class="typing-container" style="display: none;">
                <div class="typing-card">
                    <div id="typingProgress" style="color: var(--text-sub); font-size: 0.8rem; margin-bottom: 12px;"></div>
                    <div class="typing-question" id="typingQuestion"></div>
                    <div class="typing-feedback" id="typingFeedback"></div>
                    <input type="text" id="typingInput" class="typing-input" placeholder="英語を入力" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                    <button class="action-btn" id="typingActionBtn">回答</button>
                </div>
            </div>
            <div id="typingEmpty" class="empty-message">単語が登録されていません</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="viewList">単語帳</button>
        <button class="nav-item" data-target="viewCard">カード</button>
        <button class="nav-item" data-target="viewTyping">テスト</button>
    </nav>
</div>

<script>
    // Supabaseの設定
    let supabaseClient = null;
    let isSupabaseConfigured = false;
    try {
        const SUPABASE_URL = 'https://cdycrnfhuxjjfmwbghua.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkeWNybmZodXhqamZtd2JnaHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjYyNTYsImV4cCI6MjEwNzkwMjI1Nn0.mOZLmGEUqMVfo6IBDqFSxZjDL98eoJp25aE5tfQ161s';
        isSupabaseConfigured = SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('YOUR_SUPABASE_URL');
        if (isSupabaseConfigured && window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch(err) {}

    let words = [];
    const statusBox = document.getElementById('statusBox');
    const wordListEl = document.getElementById('wordList');

    const saveLocal = () => localStorage.setItem('vocab_words', JSON.stringify(words));
    const loadLocal = () => JSON.parse(localStorage.getItem('vocab_words') || '[]');

    const reloadWordsData = async () => {
        words = loadLocal();
        if (supabaseClient) {
            try {
                const { data, error } = await supabaseClient.from('words').select('*');
                if (!error && data) {
                    const map = new Map();
                    words.forEach(w => map.set(w.word, w));
                    data.forEach(w => map.set(w.word, w));
                    words = Array.from(map.values());
                    saveLocal();
                }
            } catch(e) {}
        }
    };

    const renderList = () => {
        wordListEl.innerHTML = '';
        if (words.length === 0) {
            wordListEl.innerHTML = '<div class="empty-message">登録されている単語はありません</div>';
            return;
        }

        const uniqueWords = Array.from(new Map(words.map(item => [item.word, item])).values());

        [...uniqueWords].reverse().forEach(item => {
            const el = document.createElement('div');
            el.className = 'word-item';

            const left = document.createElement('div');
            left.className = 'word-item-left';
            left.textContent = item.word;

            const right = document.createElement('div');
            right.className = 'word-item-right';
            const input = document.createElement('input');
            input.value = item.meaning;

            input.addEventListener('change', async (e) => {
                item.meaning = e.target.value.trim();
                saveLocal();
                if (supabaseClient) {
                    await supabaseClient.from('words').upsert([{ word: item.word, meaning: item.meaning }], { onConflict: 'word' }).catch(()=>{});
                }
            });

            right.appendChild(input);
            el.appendChild(left);
            el.appendChild(right);

            const speakBtn = document.createElement('button');
            speakBtn.className = 'btn-speak';
            speakBtn.textContent = '音声';
            speakBtn.onclick = () => speakWord(item.word);
            el.appendChild(speakBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.textContent = '削除';
            delBtn.onclick = async () => {
                words = words.filter(w => w.word !== item.word);
                saveLocal();
                renderList();
                if (supabaseClient) {
                    await supabaseClient.from('words').delete().eq('word', item.word).catch(()=>{});
                }
            };
            el.appendChild(delBtn);
            wordListEl.appendChild(el);
        });
    };

    const speakWord = (text) => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    };

    // OCR用画像最適化（白黒高コントラスト加工）
    const prepareImageForOCR = (file) => {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const objectUrl = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(objectUrl);
                const MAX_SIZE = 1200;
                let width = img.width, height = img.height;
                if (width > MAX_SIZE || height > MAX_SIZE) {
                    if (width > height) { height = Math.round(height * (MAX_SIZE / width)); width = MAX_SIZE; }
                    else { width = Math.round(width * (MAX_SIZE / height)); height = MAX_SIZE; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.filter = 'grayscale(100%) contrast(160%) brightness(110%)';
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => reject("画像の読み込みに失敗しました");
            img.src = objectUrl;
        });
    };

    // テキストから丸数字や番号、不要な記号を除去する強力なフィルタ処理
    const cleanWordText = (text) => {
        return text
            // 丸数字 ①〜⑳, ❶〜⓴ などを除去
            .replace(/[\u2460-\u2473\u2474-\u2487\u24b6-\u24e9\u2776-\u277f]/g, '')
            // 行頭の「1.」「(1)」「[1]」「1-」などの番号を除去
            .replace(/^[\s\d\.\-\(\)\[\]【】]+/g, '')
            // アルファベットと記号以外の混入を除去して前後の空白を削除
            .trim();
    };

    // 安定度100%クライアントOCRスキャン処理
    const imageInput = document.getElementById('imageInput');
    const uploadArea = document.getElementById('uploadArea');

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadArea.classList.add('disabled');
        statusBox.style.color = 'var(--text-main)';
        statusBox.textContent = '画像を最適化中...';

        try {
            const processedImage = await prepareImageForOCR(file);
            statusBox.textContent = '文字を解析中...';

            const worker = await Tesseract.createWorker('eng+jpn');
            const result = await worker.recognize(processedImage);
            await worker.terminate();

            statusBox.textContent = '単語と意味を整理中...';
            const lines = result.data.text.split('\n');
            const newWords = [];
            const nonAsciiRegex = /[^\x00-\x7F]+/;

            for (const text of lines) {
                const lineText = text.trim();
                if (!lineText) continue;

                const match = lineText.match(nonAsciiRegex);
                if (match) {
                    const jpIndex = match.index;
                    let rawEng = lineText.substring(0, jpIndex);
                    let rawJp = lineText.substring(jpIndex);

                    // 番号・記号の強力自動クレンジング
                    let cleanedEng = cleanWordText(rawEng)
                        .replace(/^[^a-zA-Z]+/, '')
                        .replace(/[^a-zA-Z\s\-\']+/g, '')
                        .trim();

                    let cleanedJp = cleanWordText(rawJp);

                    if (cleanedEng.length >= 1 && cleanedJp.length > 0) {
                        newWords.push({
                            word: cleanedEng.toLowerCase(),
                            meaning: cleanedJp
                        });
                    }
                }
            }

            if (newWords.length > 0) {
                words = [...words, ...newWords];
                saveLocal();
                renderList();

                statusBox.style.color = 'var(--success)';
                statusBox.textContent = `${newWords.length} 個の単語を追加しました`;

                if (supabaseClient) {
                    try { await supabaseClient.from('words').upsert(newWords, { onConflict: 'word' }); }
                    catch(err) { console.error("クラウド保存エラー", err); }
                }
            } else {
                statusBox.style.color = 'var(--danger)';
                statusBox.textContent = '単語が検出されませんでした';
            }

            imageInput.value = '';

        } catch (error) {
            alert("エラー:\n" + (error.message || error));
            statusBox.style.color = 'var(--danger)';
            statusBox.textContent = '解析に失敗しました';
        } finally {
            uploadArea.classList.remove('disabled');
        }
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
        if(confirm('すべての単語を削除しますか？')) {
            words = [];
            saveLocal();
            renderList();
            if (supabaseClient) {
                await supabaseClient.from('words').delete().neq('word', '').catch(()=>{});
            }
            statusBox.textContent = '削除が完了しました';
        }
    });

    // ナビゲーション切り替え
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', async () => {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const targetId = btn.getAttribute('data-target');
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');

            await reloadWordsData();
            if (targetId === 'viewList') renderList();
            if (targetId === 'viewCard') initCardMode();
            if (targetId === 'viewTyping') initTypingMode();
        });
    });

    // カードモード
    let cardIndex = 0; let isCardAnimating = false;
    const flashcard = document.getElementById('flashcard');
    const cardFront = document.getElementById('cardFront');
    const cardBack = document.getElementById('cardBack');
    const cardProgress = document.getElementById('cardProgress');
    const cardSpeakBtn = document.getElementById('cardSpeakBtn');

    const initCardMode = () => {
        if(words.length === 0) { document.getElementById('cardArea').style.display = 'none'; document.getElementById('cardEmpty').style.display = 'block'; return; }
        document.getElementById('cardArea').style.display = 'flex'; document.getElementById('cardEmpty').style.display = 'none';
        cardIndex = 0; isCardAnimating = false; flashcard.classList.remove('flipped'); updateCard();
    };
    const updateCard = () => {
        const item = words[cardIndex]; cardFront.textContent = item.word; cardBack.textContent = item.meaning; cardProgress.textContent = `${cardIndex + 1} / ${words.length}`;
    };
    cardSpeakBtn.addEventListener('click', (e) => { e.stopPropagation(); speakWord(words[cardIndex].word); });
    flashcard.addEventListener('click', () => { if (!isCardAnimating) flashcard.classList.toggle('flipped'); });
    document.getElementById('btnPrev').addEventListener('click', () => {
        if (isCardAnimating) return; isCardAnimating = true; flashcard.classList.remove('flipped');
        setTimeout(() => { cardIndex = (cardIndex - 1 + words.length) % words.length; updateCard(); isCardAnimating = false; }, 150);
    });
    document.getElementById('btnNext').addEventListener('click', () => {
        if (isCardAnimating) return; isCardAnimating = true; flashcard.classList.remove('flipped');
        setTimeout(() => { cardIndex = (cardIndex + 1) % words.length; updateCard(); isCardAnimating = false; }, 150);
    });

    // タイピングモード
    let typingQueue = []; let typingIndex = 0; let typingState = 'question';
    const typingQuestion = document.getElementById('typingQuestion'); const typingInput = document.getElementById('typingInput'); const typingFeedback = document.getElementById('typingFeedback'); const typingActionBtn = document.getElementById('typingActionBtn'); const typingProgress = document.getElementById('typingProgress');

    const initTypingMode = () => {
        if(words.length === 0) { document.getElementById('typingArea').style.display = 'none'; document.getElementById('typingEmpty').style.display = 'block'; return; }
        document.getElementById('typingArea').style.display = 'flex'; document.getElementById('typingEmpty').style.display = 'none';
        typingQueue = [...words].sort(() => Math.random() - 0.5); typingIndex = 0; nextTypingQuestion();
    };
    const nextTypingQuestion = () => {
        if (typingIndex >= typingQueue.length) {
            typingQuestion.textContent = 'テスト完了'; typingInput.style.display = 'none'; typingFeedback.innerHTML = ''; typingActionBtn.textContent = 'もう一度'; typingActionBtn.style.background = 'var(--primary)'; typingState = 'finished'; typingProgress.textContent = ''; return;
        }
        typingState = 'question'; const item = typingQueue[typingIndex]; typingQuestion.textContent = item.meaning; typingInput.style.display = 'block'; typingInput.value = ''; typingInput.focus(); typingFeedback.innerHTML = ''; typingActionBtn.textContent = '回答'; typingActionBtn.style.background = 'var(--primary)'; typingProgress.textContent = `残り ${typingQueue.length - typingIndex} 問`;
    };
    const checkTypingAnswer = () => {
        const item = typingQueue[typingIndex]; const userAnswer = typingInput.value.trim().toLowerCase(); const correctAnswer = item.word.toLowerCase();
        typingInput.style.display = 'none';
        if (userAnswer === correctAnswer) {
            typingFeedback.innerHTML = `<span style="color: var(--success);">正解</span>`; typingActionBtn.textContent = '次へ'; typingActionBtn.style.background = 'var(--success)'; speakWord(item.word);
        } else {
            typingFeedback.innerHTML = `<span style="color: var(--danger);">不正解</span><br><span style="font-size: 0.95rem; color: var(--text-main);">正解: <b>${item.word}</b></span>`; typingActionBtn.textContent = '次へ'; typingActionBtn.style.background = 'var(--primary)'; speakWord(item.word);
        }
        typingState = 'answered';
    };
    typingActionBtn.addEventListener('click', () => {
        if (typingState === 'question') checkTypingAnswer();
        else if (typingState === 'answered') { typingIndex++; nextTypingQuestion(); }
        else if (typingState === 'finished') initTypingMode();
    });
    typingInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && typingState === 'question') checkTypingAnswer(); });

    // 初期起動
    window.addEventListener('DOMContentLoaded', async () => {
        await reloadWordsData();
        renderList();
    });
</script>
</body>
</html>
