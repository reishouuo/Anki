<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal Vocab</title>
    
    <!-- 🚨 【絶対防御】何らかのエラーが起きたら画面に強制的にポップアップを出します -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            alert("システムエラー発生!\n" + msg + "\n行: " + line);
            return false;
        };
    </script>

    <!-- 外部ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #111827; --bg-color: #f9fafb; --surface: #ffffff;
            --text-main: #1f2937; --text-sub: #6b7280; --border: #e5e7eb;
            --success: #059669; --danger: #dc2626; --nav-height: 65px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; }
        .app-container { max-width: 600px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; background-color: var(--bg-color); position: relative; }
        header { background: var(--bg-color); padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        header h1 { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
        .header-actions button { background: none; border: none; color: var(--text-sub); font-size: 0.85rem; cursor: pointer; }
        .view-container { flex: 1; overflow-y: auto; padding: 0 20px calc(var(--nav-height) + 20px); }
        .view { display: none; height: 100%; } .view.active { display: flex; flex-direction: column; }
        
        /* 📱 スマホ特化: ボタン全体を確実にタップできるように改良 */
        .upload-area {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 24px; display: block;
            position: relative; overflow: hidden; /* 追加 */
        }
        .upload-area.disabled { opacity: 0.5; pointer-events: none; }
        
        /* スマホのバグ対策：inputをdisplay:noneにせず、透明にしてボタンの真上に覆いかぶせる */
        .upload-area input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; display: block;
        }
        
        .upload-btn { background: var(--primary); color: white; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; display: inline-block; margin-bottom: 8px; pointer-events: none; }
        .status-box { text-align: center; font-size: 0.85rem; color: var(--primary); margin-bottom: 16px; min-height: 20px; font-weight: 600; word-break: break-all; }
        .word-list { display: flex; flex-direction: column; gap: 8px; }
        .word-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .word-item-left { flex: 1; font-weight: 700; font-size: 1rem; word-wrap: break-word; }
        .word-item-right { flex: 1.5; }
        .word-item-right input { width: 100%; border: none; background: transparent; font-size: 0.95rem; color: var(--text-sub); }
        .word-item-right input:focus { outline: none; color: var(--primary); }
        .btn-speak, .btn-delete { background: none; border: none; font-size: 1.2rem; padding: 4px; color: var(--text-sub); }
        
        /* Nav Styles */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: var(--nav-height); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; border-top: 1px solid var(--border); z-index: 10; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; color: var(--text-sub); font-size: 0.7rem; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.2rem; margin-bottom: 4px; }
        .empty-message { text-align: center; color: var(--text-sub); margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Minimal Vocab</h1>
        <div class="header-actions">
            <button id="clearBtn">All Clear</button>
        </div>
    </header>

    <div class="view-container">
        <!-- 1. 単語一覧 -->
        <div id="viewList" class="view active">
            <!-- inputを透明化してボタン全体を覆う安全な作りに変更 -->
            <label class="upload-area" id="uploadArea">
                <span class="upload-btn">スキャンする</span>
                <p style="font-size: 0.75rem; color: var(--text-sub); margin-top: 8px;">タップして画像を選択</p>
                <input type="file" id="imageInput" accept="image/*">
            </label>
            
            <div id="statusBox" class="status-box">アプリ準備完了。画像を選んでください。</div>
            <div id="wordList" class="word-list"></div>
        </div>

        <div id="viewCard" class="view"><div class="empty-message">開発中...</div></div>
        <div id="viewTyping" class="view"><div class="empty-message">開発中...</div></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="viewList"><span class="nav-icon">≡</span><span>List</span></button>
    </nav>
</div>

<script>
    // ==========================================
    // ⚠️ Supabaseの安全な初期化
    // ==========================================
    let supabase = null;
    let isSupabaseConfigured = false;

    try {
        const SUPABASE_URL = 'https://cdycrnfhuxjjfmwbghua.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkeWNybmZodXhqamZtd2JnaHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjYyNTYsImV4cCI6MjEwNzkwMjI1Nn0.mOZLmGEUqMVfo6IBDqFSxZjDL98eoJp25aE5tfQ161s';
        isSupabaseConfigured = SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('YOUR_SUPABASE_URL');
        
        if (isSupabaseConfigured && window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch(err) {
        alert("データベースの初期設定でエラーが起きました: " + err.message);
    }

    let words = [];
    const statusBox = document.getElementById('statusBox');
    const wordListEl = document.getElementById('wordList');

    // --- データベース操作 (エラーで落ちないように保護) ---
    const dbSaveMultiple = async (wordsArray) => {
        if (!supabase) return;
        try { await supabase.from('words').upsert(wordsArray, { onConflict: 'word' }); } catch(e) { console.error(e); }
    };
    const dbLoadAll = async () => {
        if (!supabase) return [];
        try {
            const { data, error } = await supabase.from('words').select('*');
            if (error) throw error;
            return data || [];
        } catch(e) { console.error(e); return []; }
    };

    const renderList = () => {
        wordListEl.innerHTML = '';
        if (words.length === 0) {
            wordListEl.innerHTML = '<div class="empty-message">No words found.</div>';
            return;
        }
        [...words].reverse().forEach(item => {
            const el = document.createElement('div'); el.className = 'word-item';
            const left = document.createElement('div'); left.className = 'word-item-left'; left.textContent = item.word;
            const right = document.createElement('div'); right.className = 'word-item-right';
            const input = document.createElement('input'); input.value = item.meaning;
            right.appendChild(input);
            el.appendChild(left); el.appendChild(right);
            wordListEl.appendChild(el);
        });
    };

    // --- スマホメモリ不足回避：URL.createObjectURLによる高速化 ---
    const resizeImageFast = (file) => {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const objectUrl = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(objectUrl);
                const MAX_SIZE = 1000;
                let width = img.width, height = img.height;
                if (width > MAX_SIZE || height > MAX_SIZE) {
                    if (width > height) { height = Math.round(height * (MAX_SIZE / width)); width = MAX_SIZE; } 
                    else { width = Math.round(width * (MAX_SIZE / height)); height = MAX_SIZE; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.onerror = () => reject("画像の読み込みに失敗しました");
            img.src = objectUrl;
        });
    };

    // ==========================================
    // 📸 スキャン処理 (確実に動作を確認する)
    // ==========================================
    const imageInput = document.getElementById('imageInput');
    const uploadArea = document.getElementById('uploadArea');

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) {
            alert("ファイルが選択されませんでした");
            return;
        }

        // 🚨 【最重要】画像を選んだ瞬間に絶対にポップアップを出して生存確認
        alert("✅ 画像を認識しました！処理を開始します。");

        uploadArea.classList.add('disabled');
        statusBox.style.color = 'var(--text-main)';
        statusBox.textContent = '1. 画像を圧縮・準備しています...';

        // setTimeoutを使って、ブラウザに「準備しています...」という文字を絶対に描画させる
        setTimeout(async () => {
            try {
                // 1. 画像圧縮
                const compressedImage = await resizeImageFast(file);
                statusBox.textContent = '2. 辞書データを読み込んでいます...';

                // 2. Tesseractの実行
                const result = await Tesseract.recognize(compressedImage, 'eng+jpn', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            statusBox.textContent = `3. スキャン中... ${Math.round(m.progress * 100)}%`;
                        } else {
                            statusBox.textContent = `処理中: ${m.status}`;
                        }
                    }
                });

                statusBox.textContent = '4. 単語を抽出中...';
                const lines = result.data.lines;
                const newWords = [];
                const nonAsciiRegex = /[^\x00-\x7F]/;

                for (const line of lines) {
                    const text = line.text.trim();
                    const match = text.match(nonAsciiRegex);
                    if (match) {
                        const jpIndex = match.index;
                        let engPart = text.substring(0, jpIndex).trim().replace(/^[^a-zA-Z0-9]+/, '').replace(/[^a-zA-Z0-9]+$/, '').trim();
                        let jpPart = text.substring(jpIndex).trim();
                        if (engPart.length >= 1 && jpPart.length > 0) {
                            newWords.push({ word: engPart.toLowerCase(), meaning: jpPart });
                        }
                    }
                }

                if (newWords.length > 0) {
                    if (isSupabaseConfigured) {
                        statusBox.textContent = '5. クラウドへ保存中...';
                        await dbSaveMultiple(newWords);
                        words = await dbLoadAll();
                    } else {
                        words = [...words, ...newWords];
                    }
                }

                statusBox.style.color = newWords.length > 0 ? 'var(--success)' : 'var(--danger)';
                statusBox.textContent = newWords.length > 0 ? `${newWords.length} 単語を追加しました！` : '単語が見つかりませんでした。';
                
                imageInput.value = '';
                renderList();

            } catch (error) {
                alert("処理中にエラーが起きました:\n" + (error.message || error));
                statusBox.style.color = 'var(--danger)';
                statusBox.textContent = 'エラーが発生しました。';
            } finally {
                uploadArea.classList.remove('disabled');
            }
        }, 100);
    });

    // --- Init ---
    window.addEventListener('DOMContentLoaded', async () => {
        if (isSupabaseConfigured) {
            words = await dbLoadAll();
            renderList();
        }
    });
</script>
</body>
</html>
