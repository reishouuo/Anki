<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal Vocab</title>
    <!-- Tesseract.js (文字認識) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* よりミニマルで洗練されたカラーパレット */
            --primary: #111827; /* ダークグレー/黒系で引き締める */
            --bg-color: #f9fafb;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --success: #059669;
            --danger: #dc2626;
            --nav-height: 65px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
        }

        /* --- ヘッダー --- */
        header {
            background: var(--bg-color);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--primary);
        }

        .header-actions button {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .header-actions button:hover { color: var(--danger); }

        /* --- ビューコンテナ --- */
        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px calc(var(--nav-height) + 20px);
        }

        .view { display: none; height: 100%; }
        .view.active { display: flex; flex-direction: column; }

        /* --- 1. 単語一覧 (List) --- */
        .upload-area {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 24px;
            transition: border-color 0.2s;
        }
        
        .upload-area.disabled { opacity: 0.5; pointer-events: none; }
        .upload-area input { display: none; }
        
        .upload-btn {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }

        .status-box {
            text-align: center;
            font-size: 0.85rem;
            color: var(--primary);
            margin-bottom: 16px;
            min-height: 20px;
            font-weight: 600;
        }

        .word-list { display: flex; flex-direction: column; gap: 8px; }
        
        .word-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .word-item-left {
            flex: 1;
            font-weight: 700;
            font-size: 1rem;
            word-wrap: break-word;
        }

        .word-item-right { flex: 1.5; }
        
        .word-item-right input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-sub);
        }
        .word-item-right input:focus { outline: none; color: var(--primary); }

        .btn-speak, .btn-delete {
            background: none;
            border: none;
            font-size: 1.2rem;
            padding: 4px;
            cursor: pointer;
            color: var(--text-sub);
        }
        .btn-speak:active { color: var(--primary); }

        /* --- 2. カードモード (Flashcards) --- */
        .flashcard-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px; 
        }

        .flashcard {
            width: 100%;
            max-width: 360px;
            height: 320px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }

        .flashcard.flipped { transform: rotateX(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden; 
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .card-back {
            transform: rotateX(180deg);
            color: var(--text-sub);
            font-size: 1.8rem;
        }

        .speaker-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--border);
            z-index: 2;
        }

        .card-controls {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 40px;
            width: 100%;
        }

        .card-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 56px;
            height: 56px;
            border-radius: 28px;
            font-size: 1.2rem;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-btn:active { background: var(--bg-color); }

        .card-progress { margin-top: 20px; font-size: 0.85rem; color: var(--text-sub); }

        /* --- 3. タイピングテスト --- */
        .typing-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .typing-card {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            border-radius: 16px;
            padding: 40px 24px;
            text-align: center;
        }

        .typing-question {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-main);
        }

        .typing-input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            background: var(--bg-color);
        }
        .typing-input:focus { outline: none; border-color: var(--primary); background: var(--surface); }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .typing-feedback {
            font-size: 1.1rem;
            font-weight: 700;
            min-height: 40px;
            margin-bottom: 16px;
        }

        /* --- ボトムナビゲーション --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.2rem; margin-bottom: 4px; }
        
        .empty-message { text-align: center; color: var(--text-sub); margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Minimal Vocab</h1>
        <div class="header-actions">
            <button id="clearBtn">All Clear</button>
        </div>
    </header>

    <div class="view-container">
        <!-- 1. 単語一覧 -->
        <div id="viewList" class="view active">
            <label class="upload-area" id="uploadArea">
                <span class="upload-btn">スキャンする</span>
                <p style="font-size: 0.75rem; color: var(--text-sub); margin-top: 8px;">左に英語・右に日本語のページを撮影</p>
                <input type="file" id="imageInput" accept="image/*">
            </label>
            <div id="statusBox" class="status-box"></div>
            <div id="wordList" class="word-list"></div>
        </div>

        <!-- 2. カードビュー -->
        <div id="viewCard" class="view">
            <div id="cardArea" class="flashcard-wrapper" style="display: none;">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front">
                        <div class="speaker-icon" id="cardSpeakBtn">🔊</div>
                        <span id="cardFront">Apple</span>
                    </div>
                    <div class="card-face card-back" id="cardBack">りんご</div>
                </div>
                <div class="card-controls">
                    <button class="card-btn" id="btnPrev">←</button>
                    <button class="card-btn" id="btnNext">→</button>
                </div>
                <div class="card-progress" id="cardProgress">1 / 10</div>
            </div>
            <div id="cardEmpty" class="empty-message">データがありません</div>
        </div>

        <!-- 3. タイピングビュー -->
        <div id="viewTyping" class="view">
            <div id="typingArea" class="typing-container" style="display: none;">
                <div class="typing-card">
                    <div id="typingProgress" style="color: var(--text-sub); font-size: 0.8rem; margin-bottom: 12px;"></div>
                    <div class="typing-question" id="typingQuestion">日本語の意味</div>
                    <div class="typing-feedback" id="typingFeedback"></div>
                    <input type="text" id="typingInput" class="typing-input" placeholder="Type in English" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                    <button class="action-btn" id="typingActionBtn">回答</button>
                </div>
            </div>
            <div id="typingEmpty" class="empty-message">データがありません</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="viewList">
            <span class="nav-icon">≡</span>
            <span>List</span>
        </button>
        <button class="nav-item" data-target="viewCard">
            <span class="nav-icon">▤</span>
            <span>Card</span>
        </button>
        <button class="nav-item" data-target="viewTyping">
            <span class="nav-icon">⌨</span>
            <span>Type</span>
        </button>
    </nav>
</div>

<script>
    // ⚠️【必須設定】Supabaseの設定に書き換えてください
    const SUPABASE_URL = 'https://cdycrnfhuxjjfmwbghua.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkeWNybmZodXhqamZtd2JnaHVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjYyNTYsImV4cCI6MjEwNzkwMjI1Nn0.mOZLmGEUqMVfo6IBDqFSxZjDL98eoJp25aE5tfQ161s';
    
    const isSupabaseConfigured = SUPABASE_URL !== 'YOUR_SUPABASE_URL';
    let supabase = null;
    
    if (isSupabaseConfigured) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // --- 音声読み上げ機能 (TTS) パワーアップ ---
    const speakWord = (text) => {
        if (!window.speechSynthesis) return;
        // 再生中の音声をキャンセルして新しく読む
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US'; // 英語ネイティブ発音
        utterance.rate = 0.9;     // 聞き取りやすいよう少しゆっくり
        window.speechSynthesis.speak(utterance);
    };

    // --- データベース操作 (Supabase) ---
    const TABLE_NAME = 'words';

    const dbSaveMultiple = async (wordsArray) => {
        if (!isSupabaseConfigured) return;
        // upsert: wordが重複していればmeaningを上書き更新
        const { error } = await supabase.from(TABLE_NAME).upsert(wordsArray, { onConflict: 'word' });
        if (error) console.error(error);
    };

    const dbSave = async (obj) => {
        if (!isSupabaseConfigured) return;
        await supabase.from(TABLE_NAME).upsert([obj], { onConflict: 'word' });
    };

    const dbDelete = async (word) => {
        if (!isSupabaseConfigured) return;
        await supabase.from(TABLE_NAME).delete().eq('word', word);
    };

    const dbClear = async () => {
        if (!isSupabaseConfigured) return;
        // wordが空文字でないものを全て削除 (実質全消去)
        await supabase.from(TABLE_NAME).delete().neq('word', '');
    };

    const dbLoadAll = async () => {
        if (!isSupabaseConfigured) return [];
        // 作成日時の古い順(追加順)に取得。カラムがない場合は自動でデフォルトソート
        const { data, error } = await supabase.from(TABLE_NAME).select('*');
        if (error) { console.error(error); return []; }
        return data || [];
    };

    let words = [];
    const reloadWordsData = async () => { words = await dbLoadAll(); };

    const checkConfig = () => {
        if (!isSupabaseConfigured) {
            document.getElementById('statusBox').textContent = '⚠️ SupabaseのURLとKeyを設定してください。';
            document.getElementById('statusBox').style.color = 'var(--danger)';
            document.getElementById('uploadArea').classList.add('disabled');
            return false;
        }
        return true;
    };

    // --- UI/ナビゲーション制御 ---
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!checkConfig()) return;
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const targetId = btn.getAttribute('data-target');
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');

            await reloadWordsData();
            if (targetId === 'viewList') renderList();
            if (targetId === 'viewCard') initCardMode();
            if (targetId === 'viewTyping') initTypingMode();
        });
    });

    // --- 1. List Mode ---
    const imageInput = document.getElementById('imageInput');
    const statusBox = document.getElementById('statusBox');
    const wordListEl = document.getElementById('wordList');
    const uploadArea = document.getElementById('uploadArea');

    const renderList = () => {
        wordListEl.innerHTML = '';
        if (words.length === 0) {
            wordListEl.innerHTML = '<div class="empty-message">No words found.</div>';
            return;
        }

        // 新しいもの（または末尾）が上に来るように表示
        [...words].reverse().forEach(item => {
            const el = document.createElement('div');
            el.className = 'word-item';

            const left = document.createElement('div');
            left.className = 'word-item-left';
            left.textContent = item.word;

            const right = document.createElement('div');
            right.className = 'word-item-right';
            const input = document.createElement('input');
            input.value = item.meaning;
            input.placeholder = '意味を追加...';
            input.addEventListener('change', async (e) => {
                await dbSave({ word: item.word, meaning: e.target.value.trim() });
                await reloadWordsData();
            });
            right.appendChild(input);

            // 音声再生ボタン
            const speakBtn = document.createElement('button');
            speakBtn.className = 'btn-speak';
            speakBtn.innerHTML = '🔊';
            speakBtn.onclick = () => speakWord(item.word);

            // 削除ボタン
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.innerHTML = '✕';
            delBtn.onclick = async () => {
                await dbDelete(item.word);
                await reloadWordsData();
                renderList();
            };

            el.appendChild(left);
            el.appendChild(right);
            el.appendChild(speakBtn);
            el.appendChild(delBtn);
            wordListEl.appendChild(el);
        });
    };

    imageInput.addEventListener('change', async (e) => {
        if (!checkConfig()) return;
        const file = e.target.files[0];
        if (!file) return;

        uploadArea.classList.add('disabled');
        statusBox.style.color = 'var(--text-sub)';
        statusBox.textContent = 'Scanning...';
        
        try {
            const result = await Tesseract.recognize(file, 'eng+jpn', {
                logger: m => {
                    if(m.status === 'recognizing text') {
                        statusBox.textContent = `Scanning... ${Math.round(m.progress * 100)}%`;
                    }
                }
            });

            const lines = result.data.lines;
            const newWords = [];
            const nonAsciiRegex = /[^\x00-\x7F]/;

            for (const line of lines) {
                const text = line.text.trim();
                const match = text.match(nonAsciiRegex);

                if (match) {
                    const jpIndex = match.index;
                    let engPart = text.substring(0, jpIndex).trim();
                    let jpPart = text.substring(jpIndex).trim();
                    engPart = engPart.replace(/^[^a-zA-Z0-9]+/, '').replace(/[^a-zA-Z0-9]+$/, '').trim();

                    if (engPart.length >= 1 && jpPart.length > 0) {
                        newWords.push({ word: engPart.toLowerCase(), meaning: jpPart });
                    }
                }
            }

            if (newWords.length > 0) {
                statusBox.textContent = 'Saving to Supabase...';
                await dbSaveMultiple(newWords); 
            }

            statusBox.style.color = newWords.length > 0 ? 'var(--primary)' : 'var(--danger)';
            statusBox.textContent = newWords.length > 0 
                ? `Added ${newWords.length} words.` 
                : 'No words found.';
            
            imageInput.value = '';
            await reloadWordsData();
            renderList();

        } catch (error) {
            console.error(error);
            statusBox.style.color = 'var(--danger)';
            statusBox.textContent = 'Error occurred.';
        } finally {
            uploadArea.classList.remove('disabled');
        }
    });

    document.getElementById('clearBtn').addEventListener('click', async () => {
        if (!checkConfig()) return;
        if(confirm('データベース上のすべての単語を削除しますか？')) {
            await dbClear();
            words = [];
            renderList();
            statusBox.textContent = '';
        }
    });

    // --- 2. Card Mode ---
    let cardIndex = 0;
    let isCardAnimating = false; 
    const flashcard = document.getElementById('flashcard');
    const cardFront = document.getElementById('cardFront');
    const cardBack = document.getElementById('cardBack');
    const cardProgress = document.getElementById('cardProgress');
    const cardSpeakBtn = document.getElementById('cardSpeakBtn');
    
    const initCardMode = () => {
        if(words.length === 0) {
            document.getElementById('cardArea').style.display = 'none';
            document.getElementById('cardEmpty').style.display = 'block';
            return;
        }
        document.getElementById('cardArea').style.display = 'flex';
        document.getElementById('cardEmpty').style.display = 'none';
        
        cardIndex = 0;
        isCardAnimating = false;
        flashcard.classList.remove('flipped');
        updateCard();
    };

    const updateCard = () => {
        const item = words[cardIndex];
        cardFront.textContent = item.word;
        cardBack.textContent = item.meaning;
        cardProgress.textContent = `${cardIndex + 1} / ${words.length}`;
        // 新しいカードになったら英語を自動で読み上げる（不要なら消してOK）
        speakWord(item.word);
    };

    // 発音ボタン（カードめくりを防止するためにstopPropagation）
    cardSpeakBtn.addEventListener('click', (e) => {
        e.stopPropagation(); 
        speakWord(words[cardIndex].word);
    });

    flashcard.addEventListener('click', () => {
        if (!isCardAnimating) flashcard.classList.toggle('flipped');
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
        if (isCardAnimating) return;
        isCardAnimating = true;
        flashcard.classList.remove('flipped');
        setTimeout(() => {
            cardIndex = (cardIndex - 1 + words.length) % words.length;
            updateCard();
            isCardAnimating = false;
        }, 150);
    });

    document.getElementById('btnNext').addEventListener('click', () => {
        if (isCardAnimating) return;
        isCardAnimating = true;
        flashcard.classList.remove('flipped');
        setTimeout(() => {
            cardIndex = (cardIndex + 1) % words.length;
            updateCard();
            isCardAnimating = false;
        }, 150);
    });

    // --- 3. Typing Mode ---
    let typingQueue = [];
    let typingIndex = 0;
    let typingState = 'question'; 

    const typingQuestion = document.getElementById('typingQuestion');
    const typingInput = document.getElementById('typingInput');
    const typingFeedback = document.getElementById('typingFeedback');
    const typingActionBtn = document.getElementById('typingActionBtn');
    const typingProgress = document.getElementById('typingProgress');

    const initTypingMode = () => {
        if(words.length === 0) {
            document.getElementById('typingArea').style.display = 'none';
            document.getElementById('typingEmpty').style.display = 'block';
            return;
        }
        document.getElementById('typingArea').style.display = 'flex';
        document.getElementById('typingEmpty').style.display = 'none';

        typingQueue = [...words].sort(() => Math.random() - 0.5);
        typingIndex = 0;
        nextTypingQuestion();
    };

    const nextTypingQuestion = () => {
        if (typingIndex >= typingQueue.length) {
            typingQuestion.textContent = '🎉 全問終了！';
            typingInput.style.display = 'none';
            typingFeedback.innerHTML = '';
            typingActionBtn.textContent = 'Restart';
            typingActionBtn.style.background = 'var(--primary)';
            typingState = 'finished';
            typingProgress.textContent = '';
            return;
        }

        typingState = 'question';
        const item = typingQueue[typingIndex];
        
        typingQuestion.textContent = item.meaning; 
        
        typingInput.style.display = 'block';
        typingInput.value = '';
        typingInput.focus();
        typingFeedback.innerHTML = '';
        typingActionBtn.textContent = 'Check';
        typingActionBtn.style.background = 'var(--primary)';
        typingProgress.textContent = `残り ${typingQueue.length - typingIndex} 問`;
    };

    const checkTypingAnswer = () => {
        const item = typingQueue[typingIndex];
        const userAnswer = typingInput.value.trim().toLowerCase();
        const correctAnswer = item.word.toLowerCase();

        typingInput.style.display = 'none';

        if (userAnswer === correctAnswer) {
            typingFeedback.innerHTML = `<span style="color: var(--success);">正解！✨</span>`;
            typingActionBtn.textContent = 'Next';
            typingActionBtn.style.background = 'var(--success)';
            speakWord(item.word); // 正解したら発音
        } else {
            typingFeedback.innerHTML = `
                <span style="color: var(--danger);">不正解</span><br>
                <span style="font-size: 1.1rem; color: var(--text-main); font-weight: 500;">Ans: <b>${item.word}</b></span>
            `;
            typingActionBtn.textContent = 'Next';
            typingActionBtn.style.background = 'var(--primary)';
            speakWord(item.word); // 答え合わせ時に発音
        }
        typingState = 'answered';
    };

    typingActionBtn.addEventListener('click', () => {
        if (typingState === 'question') checkTypingAnswer();
        else if (typingState === 'answered') {
            typingIndex++;
            nextTypingQuestion();
        }
        else if (typingState === 'finished') initTypingMode();
    });

    typingInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && typingState === 'question') checkTypingAnswer();
    });

    // --- Init ---
    window.addEventListener('DOMContentLoaded', async () => {
        if (checkConfig()) {
            try {
                await reloadWordsData();
                renderList();
            } catch(e) {
                console.error('Supabase Read Error', e);
                document.getElementById('statusBox').textContent = 'データベース接続エラー';
            }
        }
    });
</script>

</body>
</html>
