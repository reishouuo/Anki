<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Vocab</title>
    
    <style>
        :root {
            --primary: #111827;
            --bg-color: #f9fafb;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --success: #059669;
            --danger: #dc2626;
            --nav-height: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
        }

        header {
            background: var(--surface);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.01em;
        }

        .folder-bar {
            background: var(--surface);
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }

        .folder-select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
        }

        .folder-select:focus {
            border-color: var(--primary);
        }

        .btn-add-folder {
            background: none;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px calc(var(--nav-height) + 20px);
        }

        .view { display: none; height: 100%; }
        .view.active { display: flex; flex-direction: column; }

        /* 入力フォーム */
        .add-word-area {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            background: var(--bg-color);
        }

        .input-row input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
        }

        .btn-add-word {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* 単語リスト */
        .word-list { display: flex; flex-direction: column; gap: 8px; }

        .word-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .word-item-left {
            flex: 1;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--primary);
            word-wrap: break-word;
        }

        .word-item-right { flex: 1.5; }
        .word-item-right input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            color: var(--text-sub);
        }
        .word-item-right input:focus {
            outline: none;
            color: var(--primary);
            border-bottom: 1px solid var(--primary);
        }

        .btn-speak, .btn-delete {
            background: none;
            border: none;
            font-size: 0.8rem;
            padding: 4px 6px;
            color: var(--text-sub);
            cursor: pointer;
        }

        /* フラッシュカード */
        .flashcard-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .flashcard {
            width: 100%;
            max-width: 360px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s;
            cursor: pointer;
        }

        .flashcard.flipped { transform: rotateX(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
        }

        .card-back {
            transform: rotateX(180deg);
            color: var(--text-sub);
            font-size: 1.6rem;
        }

        .speaker-btn-card {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 0.75rem;
            color: var(--text-sub);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 2;
            background: var(--surface);
            cursor: pointer;
        }

        .card-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 32px;
            width: 100%;
        }

        .card-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 48px;
            height: 48px;
            border-radius: 24px;
            font-size: 1rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .card-progress { margin-top: 16px; font-size: 0.8rem; color: var(--text-sub); }

        /* タイピング */
        .typing-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .typing-card {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
        }

        .typing-question {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-main);
        }

        .typing-input {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            margin-bottom: 16px;
            background: var(--bg-color);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .typing-feedback {
            font-size: 1rem;
            font-weight: 600;
            min-height: 36px;
            margin-bottom: 12px;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--surface);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item.active { color: var(--primary); border-top: 2px solid var(--primary); }
        .empty-message { text-align: center; color: var(--text-sub); margin-top: 40px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Smart Vocab</h1>
    </header>

    <div class="folder-bar">
        <select id="folderSelect" class="folder-select"></select>
        <button id="addFolderBtn" class="btn-add-folder">新規フォルダ</button>
    </div>

    <div class="view-container">
        <!-- 1. 単語一覧 -->
        <div id="viewList" class="view active">
            <div class="add-word-area">
                <div class="input-row">
                    <input type="text" id="inputWord" placeholder="英単語" autocomplete="off" autocapitalize="none">
                    <input type="text" id="inputMeaning" placeholder="日本語訳" autocomplete="off">
                </div>
                <button id="addWordBtn" class="btn-add-word">追加</button>
            </div>
            <div id="wordList" class="word-list"></div>
        </div>

        <!-- 2. カードビュー -->
        <div id="viewCard" class="view">
            <div id="cardArea" class="flashcard-wrapper" style="display: none;">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front">
                        <button class="speaker-btn-card" id="cardSpeakBtn">音声</button>
                        <span id="cardFront"></span>
                    </div>
                    <div class="card-face card-back" id="cardBack"></div>
                </div>
                <div class="card-controls">
                    <button class="card-btn" id="btnPrev">&lt;</button>
                    <button class="card-btn" id="btnNext">&gt;</button>
                </div>
                <div class="card-progress" id="cardProgress"></div>
            </div>
            <div id="cardEmpty" class="empty-message">このフォルダには単語がありません</div>
        </div>

        <!-- 3. タイピングビュー -->
        <div id="viewTyping" class="view">
            <div id="typingArea" class="typing-container" style="display: none;">
                <div class="typing-card">
                    <div id="typingProgress" style="color: var(--text-sub); font-size: 0.8rem; margin-bottom: 12px;"></div>
                    <div class="typing-question" id="typingQuestion"></div>
                    <div class="typing-feedback" id="typingFeedback"></div>
                    <input type="text" id="typingInput" class="typing-input" placeholder="英語を入力" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
                    <button class="action-btn" id="typingActionBtn">回答</button>
                </div>
            </div>
            <div id="typingEmpty" class="empty-message">このフォルダには単語がありません</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="viewList">単語帳</button>
        <button class="nav-item" data-target="viewCard">カード</button>
        <button class="nav-item" data-target="viewTyping">テスト</button>
    </nav>
</div>

<script>
    // データ構造: フォルダと単語
    let folders = JSON.parse(localStorage.getItem('vocab_folders_v3')) || [{ id: 'default', name: '基本フォルダ' }];
    let words = JSON.parse(localStorage.getItem('vocab_words_v3')) || [];
    let currentFolderId = folders[0].id;

    const folderSelect = document.getElementById('folderSelect');
    const wordListEl = document.getElementById('wordList');

    // データ保存
    const saveData = () => {
        localStorage.setItem('vocab_folders_v3', JSON.stringify(folders));
        localStorage.setItem('vocab_words_v3', JSON.stringify(words));
    };

    // 音声再生
    const speakWord = (text) => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    };

    // フォルダの描画
    const renderFolders = () => {
        folderSelect.innerHTML = '';
        folders.forEach(f => {
            const option = document.createElement('option');
            option.value = f.id;
            option.textContent = f.name;
            folderSelect.appendChild(option);
        });
        folderSelect.value = currentFolderId;
    };

    // フォルダ追加
    document.getElementById('addFolderBtn').addEventListener('click', () => {
        const name = prompt('新しいフォルダ名を入力してください');
        if (name && name.trim()) {
            const newId = 'folder_' + Date.now();
            folders.push({ id: newId, name: name.trim() });
            currentFolderId = newId;
            saveData();
            renderFolders();
            refreshCurrentView();
        }
    });

    // フォルダ切り替え
    folderSelect.addEventListener('change', (e) => {
        currentFolderId = e.target.value;
        refreshCurrentView();
    });

    // 現在のフォルダの単語を取得
    const getCurrentFolderWords = () => words.filter(w => w.folderId === currentFolderId);

    // 単語の追加
    const inputWord = document.getElementById('inputWord');
    const inputMeaning = document.getElementById('inputMeaning');

    document.getElementById('addWordBtn').addEventListener('click', () => {
        const w = inputWord.value.trim().toLowerCase();
        const m = inputMeaning.value.trim();
        if (!w || !m) return;

        // 同じフォルダ内に既存の単語があるかチェック
        const existingIndex = words.findIndex(item => item.word === w && item.folderId === currentFolderId);
        if (existingIndex >= 0) {
            words[existingIndex].meaning = m;
        } else {
            words.unshift({ id: Date.now(), folderId: currentFolderId, word: w, meaning: m });
        }

        inputWord.value = '';
        inputMeaning.value = '';
        inputWord.focus();
        saveData();
        renderList();
    });

    // 単語リストの描画
    const renderList = () => {
        wordListEl.innerHTML = '';
        const currentWords = getCurrentFolderWords();

        if (currentWords.length === 0) {
            wordListEl.innerHTML = '<div class="empty-message">単語が登録されていません</div>';
            return;
        }

        currentWords.forEach(item => {
            const el = document.createElement('div');
            el.className = 'word-item';

            const left = document.createElement('div');
            left.className = 'word-item-left';
            left.textContent = item.word;

            const right = document.createElement('div');
            right.className = 'word-item-right';
            const input = document.createElement('input');
            input.value = item.meaning;

            input.addEventListener('change', (e) => {
                item.meaning = e.target.value.trim();
                saveData();
            });

            right.appendChild(input);
            el.appendChild(left);
            el.appendChild(right);

            const speakBtn = document.createElement('button');
            speakBtn.className = 'btn-speak';
            speakBtn.textContent = '音声';
            speakBtn.onclick = () => speakWord(item.word);
            el.appendChild(speakBtn);

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.textContent = '削除';
            delBtn.onclick = () => {
                if(confirm('削除しますか？')) {
                    words = words.filter(w => w.id !== item.id);
                    saveData();
                    renderList();
                }
            };
            el.appendChild(delBtn);
            wordListEl.appendChild(el);
        });
    };

    // ナビゲーション切り替え
    const refreshCurrentView = () => {
        const activeNav = document.querySelector('.nav-item.active').getAttribute('data-target');
        if (activeNav === 'viewList') renderList();
        if (activeNav === 'viewCard') initCardMode();
        if (activeNav === 'viewTyping') initTypingMode();
    };

    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const targetId = btn.getAttribute('data-target');
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(targetId).classList.add('active');

            refreshCurrentView();
        });
    });

    // カードモード
    let cardIndex = 0; let isCardAnimating = false;
    const flashcard = document.getElementById('flashcard');
    let currentCardWords = [];

    const initCardMode = () => {
        currentCardWords = getCurrentFolderWords();
        if(currentCardWords.length === 0) { 
            document.getElementById('cardArea').style.display = 'none'; 
            document.getElementById('cardEmpty').style.display = 'block'; 
            return; 
        }
        document.getElementById('cardArea').style.display = 'flex'; 
        document.getElementById('cardEmpty').style.display = 'none';
        cardIndex = 0; isCardAnimating = false; flashcard.classList.remove('flipped'); updateCard();
    };

    const updateCard = () => {
        const item = currentCardWords[cardIndex]; 
        document.getElementById('cardFront').textContent = item.word; 
        document.getElementById('cardBack').textContent = item.meaning; 
        document.getElementById('cardProgress').textContent = `${cardIndex + 1} / ${currentCardWords.length}`;
    };

    document.getElementById('cardSpeakBtn').addEventListener('click', (e) => { 
        e.stopPropagation(); 
        speakWord(currentCardWords[cardIndex].word); 
    });

    flashcard.addEventListener('click', () => { 
        if (!isCardAnimating) flashcard.classList.toggle('flipped'); 
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
        if (isCardAnimating) return; isCardAnimating = true; flashcard.classList.remove('flipped');
        setTimeout(() => { cardIndex = (cardIndex - 1 + currentCardWords.length) % currentCardWords.length; updateCard(); isCardAnimating = false; }, 150);
    });

    document.getElementById('btnNext').addEventListener('click', () => {
        if (isCardAnimating) return; isCardAnimating = true; flashcard.classList.remove('flipped');
        setTimeout(() => { cardIndex = (cardIndex + 1) % currentCardWords.length; updateCard(); isCardAnimating = false; }, 150);
    });

    // タイピングモード
    let typingQueue = []; let typingIndex = 0; let typingState = 'question';
    const typingQuestion = document.getElementById('typingQuestion'); 
    const typingInput = document.getElementById('typingInput'); 
    const typingFeedback = document.getElementById('typingFeedback'); 
    const typingActionBtn = document.getElementById('typingActionBtn'); 
    const typingProgress = document.getElementById('typingProgress');

    const initTypingMode = () => {
        const currentTypingWords = getCurrentFolderWords();
        if(currentTypingWords.length === 0) { 
            document.getElementById('typingArea').style.display = 'none'; 
            document.getElementById('typingEmpty').style.display = 'block'; 
            return; 
        }
        document.getElementById('typingArea').style.display = 'flex'; 
        document.getElementById('typingEmpty').style.display = 'none';
        typingQueue = [...currentTypingWords].sort(() => Math.random() - 0.5); 
        typingIndex = 0; 
        nextTypingQuestion();
    };

    const nextTypingQuestion = () => {
        if (typingIndex >= typingQueue.length) {
            typingQuestion.textContent = 'テスト完了'; 
            typingInput.style.display = 'none'; 
            typingFeedback.innerHTML = ''; 
            typingActionBtn.textContent = 'もう一度'; 
            typingActionBtn.style.background = 'var(--primary)'; 
            typingState = 'finished'; 
            typingProgress.textContent = ''; 
            return;
        }
        typingState = 'question'; 
        const item = typingQueue[typingIndex]; 
        typingQuestion.textContent = item.meaning; 
        typingInput.style.display = 'block'; 
        typingInput.value = ''; 
        typingInput.focus(); 
        typingFeedback.innerHTML = ''; 
        typingActionBtn.textContent = '回答'; 
        typingActionBtn.style.background = 'var(--primary)'; 
        typingProgress.textContent = `残り ${typingQueue.length - typingIndex} 問`;
    };

    const checkTypingAnswer = () => {
        const item = typingQueue[typingIndex]; 
        const userAnswer = typingInput.value.trim().toLowerCase(); 
        const correctAnswer = item.word.toLowerCase();
        typingInput.style.display = 'none';
        
        if (userAnswer === correctAnswer) {
            typingFeedback.innerHTML = `<span style="color: var(--success);">正解</span>`; 
            typingActionBtn.textContent = '次へ'; 
            typingActionBtn.style.background = 'var(--success)'; 
            speakWord(item.word);
        } else {
            typingFeedback.innerHTML = `<span style="color: var(--danger);">不正解</span><br><span style="font-size: 0.95rem; color: var(--text-main);">正解: <b>${item.word}</b></span>`; 
            typingActionBtn.textContent = '次へ'; 
            typingActionBtn.style.background = 'var(--primary)'; 
            speakWord(item.word);
        }
        typingState = 'answered';
    };

    typingActionBtn.addEventListener('click', () => {
        if (typingState === 'question') checkTypingAnswer();
        else if (typingState === 'answered') { typingIndex++; nextTypingQuestion(); }
        else if (typingState === 'finished') initTypingMode();
    });

    typingInput.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter' && typingState === 'question') checkTypingAnswer(); 
    });

    // 初期化
    renderFolders();
    renderList();

</script>
</body>
</html>
